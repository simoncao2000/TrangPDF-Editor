<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>TrangPDF</title>
    <!-- Apply the saved theme before the first paint (key: THEME_STORAGE_KEY in packages/ui). -->
    <script>
      // Safari can ignore the viewport scale limit, including on sheets outside the viewer.
      for (const name of ["gesturestart", "gesturechange"]) {
        document.addEventListener(name, (event) => event.preventDefault(), { passive: false });
      }
      document.addEventListener(
        "touchstart",
        (event) => {
          if (event.touches.length > 1) event.preventDefault();
        },
        { passive: false },
      );
      try {
        var theme = localStorage.getItem("trangpdf-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <meta name="description" content="Read PDFs on your device. Nothing is uploaded." />
  </head>
  <body class="touch-manipulation">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
